<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>TreeWise – Interactive Tree Algorithm Platform</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#06080f;
  --bg2:#0d1221;
  --bg3:#111827;
  --bg4:#1a2235;
  --bg5:#232d42;
  --border:#1e2d45;
  --border2:#263347;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --accent3:#06b6d4;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --r:10px;
  --r2:16px;
  --shadow:0 8px 32px rgba(0,0,0,.6);
  --glow:0 0 24px rgba(99,102,241,.25);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit;transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit}
svg{flex-shrink:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Navbar */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;background:rgba(6,8,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem}
.nav-brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.15rem;cursor:pointer;letter-spacing:-.02em}
.nav-brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:var(--glow)}
.nav-brand-text{background:linear-gradient(90deg,#a5b4fc,#c4b5fd,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:.25rem;margin-left:1.5rem}
.nav-link{padding:.4rem .85rem;border-radius:8px;font-size:.875rem;color:var(--text2);background:transparent}
.nav-link:hover{color:var(--text);background:var(--bg4)}
.nav-link.active{color:var(--text);background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.3)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.engine-badge{display:flex;align-items:center;gap:6px;background:var(--bg4);border:1px solid var(--border2);padding:.28rem .7rem;border-radius:999px;font-size:.75rem;color:var(--text2)}
.engine-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.7)}

/* Bottom Nav (Mobile) */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(6,8,15,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);z-index:200;justify-content:space-around;align-items:center;padding:0 .5rem}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;color:var(--text3);font-size:.72rem;font-weight:600;padding:.35rem .75rem;border-radius:8px;flex:1}
.bottom-nav-item.active{color:#a5b4fc}

/* Hero */
.hero{padding:7rem 1.5rem 4rem;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,.18) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 80% 50%,rgba(6,182,212,.08) 0%,transparent 60%);pointer-events:none}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%)}
.hero-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);border-radius:999px;padding:.35rem 1rem;font-size:.8rem;color:#a5b4fc;margin-bottom:1.5rem}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.9)}}
.hero h1{font-size:clamp(1.9rem,5.5vw,3.8rem);font-weight:900;line-height:1.15;letter-spacing:-.03em;margin-bottom:1rem}
.grad{background:linear-gradient(135deg,#a5b4fc 0%,#c4b5fd 40%,#67e8f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{max-width:580px;margin:0 auto 2rem;color:var(--text2);font-size:1.02rem;line-height:1.6}
.hero-cta{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem}
.btn-hero{padding:.7rem 1.5rem;border-radius:12px;font-weight:700;font-size:.95rem}
.btn-grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.btn-grad:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(99,102,241,.5)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-outline:hover{background:var(--bg4);border-color:var(--accent)}
.hero-stats{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
.h-stat-val{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#a5b4fc,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.h-stat-lbl{font-size:.78rem;color:var(--text3)}

/* Sections */
.sec{padding:4rem 1.5rem;max-width:1200px;margin:0 auto}
.sec-eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.sec-eyebrow::before{content:'';width:18px;height:2px;background:var(--accent);border-radius:1px}
.sec-title{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin-bottom:.6rem;line-height:1.2}
.sec-sub{color:var(--text2);max-width:540px;margin-bottom:2.5rem;font-size:.95rem;line-height:1.6}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.25rem}
.feat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;cursor:pointer;transition:all .3s}
.feat-card:hover{border-color:rgba(99,102,241,.5);transform:translateY(-2px);box-shadow:0 10px 32px rgba(99,102,241,.15)}
.feat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;margin-bottom:1.1rem}
.fi-indigo{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3)}
.fi-cyan{background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.25)}
.fi-green{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25)}
.fi-yellow{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25)}
.feat-card h3{font-size:1.02rem;font-weight:700;margin-bottom:.4rem}
.feat-card p{font-size:.85rem;color:var(--text2);line-height:1.5}

/* Visualizer Layout */
.viz-page{display:flex;height:calc(100vh - 60px);margin-top:60px;overflow:hidden;position:relative}
.viz-panel{width:320px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.viz-canvas-wrap{flex:1;position:relative;background:var(--bg);overflow:hidden;cursor:grab}
.viz-canvas-wrap:active{cursor:grabbing}

.vp-sec{border-bottom:1px solid var(--border);padding:.9rem 1rem}
.vp-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:.65rem;display:flex;align-items:center;gap:.4rem}
.vp-inp{flex:1;padding:.48rem .75rem;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:.85rem;width:100%}
.vp-inp:focus{outline:none;border-color:var(--accent)}
.vp-row{display:flex;gap:.4rem;margin-bottom:.4rem}
.vbtn{padding:.48rem .85rem;border-radius:8px;font-size:.82rem;font-weight:600;transition:all .2s;white-space:nowrap}
.vbtn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.vbtn-primary:hover{filter:brightness(1.1)}
.vbtn-ghost{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}
.vbtn-ghost:hover{background:var(--bg5);color:var(--text)}
.vbtn-red{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.vbtn-green{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.vbtn-full{width:100%;margin-bottom:.35rem}
.vbtn-grid2{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}

.step-bar{display:flex;gap:.35rem;align-items:center}
.step-bar button{flex:1;padding:.45rem;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:.8rem;font-weight:600}
.step-bar button:hover:not(:disabled){background:var(--bg5);color:var(--text)}
.step-bar button:disabled{opacity:.35;cursor:not-allowed}
.step-info-box{background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:.6rem .8rem;font-size:.82rem;color:var(--text2);margin-top:.45rem;min-height:46px;line-height:1.45}
.step-info-box strong{color:var(--text)}

.order-wrap{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.ord-node{background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:.15rem .5rem;font-size:.78rem;transition:all .3s}
.ord-node.cur{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 8px rgba(99,102,241,.5)}
.ord-node.done{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.35);color:#a5b4fc}

.canvas-hint-pill{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);background:rgba(13,18,33,.88);border:1px solid rgba(99,102,241,.35);border-radius:999px;padding:.32rem .9rem;font-size:.78rem;color:#a5b4fc;backdrop-filter:blur(10px);white-space:nowrap;pointer-events:none;z-index:10}
.canvas-toolbar{position:absolute;top:.75rem;right:.75rem;display:flex;gap:.35rem;z-index:10}
.canvas-toolbar button{background:rgba(13,18,33,.88);border:1px solid var(--border2);color:var(--text2);padding:.4rem .65rem;border-radius:8px;font-size:.8rem;backdrop-filter:blur(8px)}
.canvas-legend{position:absolute;bottom:.75rem;left:.75rem;background:rgba(13,18,33,.88);backdrop-filter:blur(8px);border:1px solid var(--border2);border-radius:var(--r);padding:.5rem .85rem;font-size:.75rem;display:flex;gap:.8rem;flex-wrap:wrap;z-index:10;pointer-events:none}
.leg-item{display:flex;align-items:center;gap:.3rem;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:50%}

/* Learn & Notes */
.learn-layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px);margin-top:60px}
.learn-nav{background:var(--bg2);border-right:1px solid var(--border);padding:1.25rem 1rem;overflow-y:auto}
.learn-group-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);font-weight:700;padding:.25rem .5rem;margin-bottom:.35rem}
.learn-item{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;padding:.48rem .7rem;border-radius:8px;font-size:.85rem;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .2s}
.learn-item:hover{background:var(--bg4);color:var(--text)}
.learn-item.active{background:rgba(99,102,241,.18);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)}
.learn-item-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0}
.learn-item.active .learn-item-dot{background:var(--accent)}
.learn-content{padding:2.5rem 2rem;overflow-y:auto;max-width:840px}
.learn-article h1{font-size:1.85rem;font-weight:800;margin-bottom:.4rem;line-height:1.2}
.learn-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;margin-bottom:1.4rem;border:1px solid;background:rgba(99,102,241,.12);color:#a5b4fc;border-color:rgba(99,102,241,.25)}
.code-block{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:1.1rem 1.4rem;font-family:'Cascadia Code','Fira Code',monospace;font-size:.82rem;color:#a5b4fc;overflow-x:auto;margin:.8rem 0 1.4rem;line-height:1.6}
.cplx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.65rem;margin:1rem 0}
.cplx-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.cplx-label{font-size:.72rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2rem}
.cplx-val{font-size:1.2rem;font-weight:800;font-family:monospace}
.cplx-val.good{color:var(--green)}.cplx-val.ok{color:var(--yellow)}.cplx-val.bad{color:var(--red)}

.notes-page{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px);margin-top:60px}
.notes-side{background:var(--bg2);border-right:1px solid var(--border);padding:1.1rem;overflow-y:auto}
.note-list-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.75rem .9rem;cursor:pointer;margin-bottom:.45rem;transition:all .2s}
.note-list-item:hover{border-color:rgba(99,102,241,.4)}
.note-list-item.active{border-color:var(--accent);background:rgba(99,102,241,.06)}
.notes-top{padding:.9rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.65rem;background:var(--bg2)}
.note-title-inp{flex:1;background:transparent;border:none;color:var(--text);font-size:1.05rem;font-weight:700;padding:0}
.note-title-inp:focus{outline:none}
.notes-textarea{flex:1;background:transparent;border:none;color:var(--text);padding:1.25rem;font-size:.92rem;line-height:1.7;resize:none;min-height:400px}
.notes-textarea:focus{outline:none}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:.75rem 1.15rem;font-size:.85rem;z-index:9999;box-shadow:var(--shadow);display:flex;align-items:center;gap:.55rem;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.info{border-color:var(--accent);color:#a5b4fc}

@media (max-width: 860px) {
  .nav-links{display:none}
  .bottom-nav{display:flex}
  body{padding-bottom:62px}
  .viz-page{flex-direction:column-reverse;height:calc(100vh - 122px)}
  .viz-panel{width:100%;min-width:unset;height:45%;max-height:300px;border-right:none;border-top:1px solid var(--border)}
  .viz-canvas-wrap{height:55%}
  .canvas-legend{display:none}
  .learn-layout,.notes-page{grid-template-columns:1fr;min-height:calc(100vh - 122px)}
  .learn-nav,.notes-side{display:flex;overflow-x:auto;padding:.6rem;gap:.5rem;border-right:none;border-bottom:1px solid var(--border)}
  .learn-group-title{display:none}
  .learn-item{white-space:nowrap;padding:.35rem .65rem;font-size:.8rem}
  .learn-content{padding:1.5rem 1.25rem}
  .note-list-item{padding:.4rem .75rem;margin-bottom:0;white-space:nowrap}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;

/* Tree Node Data Class */
class TreeNodeModel {
  constructor(v, height=1) {
    this.val = v;
    this.height = height;
    this.left = null;
    this.right = null;
    this.id = 'node_' + Math.random().toString(36).slice(2, 9);
  }
}

/* Fallback local client-side algorithms (used when server is offline, e.g. GitHub Pages) */
function localBstInsert(root, v) {
  if (!root || root.val === null) return new TreeNodeModel(v);
  if (v < root.val) root.left = localBstInsert(root.left, v);
  else if (v > root.val) root.right = localBstInsert(root.right, v);
  return root;
}

function localBstDelete(root, v) {
  if (!root || root.val === null) return null;
  if (v < root.val) { root.left = localBstDelete(root.left, v); return root; }
  if (v > root.val) { root.right = localBstDelete(root.right, v); return root; }
  if (!root.left) return root.right;
  if (!root.right) return root.left;
  let s = root.right;
  while (s.left) s = s.left;
  root.val = s.val;
  root.right = localBstDelete(root.right, s.val);
  return root;
}

/* Converts dictionary tree (from backend) to TreeNodeModel */
function dictToTree(d) {
  if (!d || d.val === undefined || d.val === null) return null;
  const n = new TreeNodeModel(d.val, d.height || 1);
  n.left = dictToTree(d.left);
  n.right = dictToTree(d.right);
  return n;
}

function computeTreeLayout(root) {
  const pos = {};
  const H = 64, V = 80;
  function getWidth(n) {
    if (!n || n.val === null) return 0;
    return Math.max(1, getWidth(n.left) + getWidth(n.right));
  }
  function assignPos(n, depth, left, right) {
    if (!n || n.val === null) return;
    const mid = (left + right) / 2;
    pos[n.id] = { x: mid, y: depth * V + 60 };
    assignPos(n.left, depth + 1, left, mid);
    assignPos(n.right, depth + 1, mid, right);
  }
  const totalW = Math.max(getWidth(root), 1);
  assignPos(root, 0, 0, totalW * H);
  return pos;
}

function collectTreeEdges(node, pos, edges=[]) {
  if (!node || node.val === null) return edges;
  if (node.left && node.left.val !== null && pos[node.left.id]) {
    edges.push({ from: pos[node.id], to: pos[node.left.id] });
    collectTreeEdges(node.left, pos, edges);
  }
  if (node.right && node.right.val !== null && pos[node.right.id]) {
    edges.push({ from: pos[node.id], to: pos[node.right.id] });
    collectTreeEdges(node.right, pos, edges);
  }
  return edges;
}

function collectNodes(n, arr=[]) {
  if (!n || n.val === null) return arr;
  arr.push(n);
  collectNodes(n.left, arr);
  collectNodes(n.right, arr);
  return arr;
}

/* Toast */
function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2600); return () => clearTimeout(t); }, []);
  return <div className={`toast ${type}`}>{msg}</div>;
}

/* Interactive SVG Canvas */
function TreeCanvas({ root, currentVal, visitedVals, foundVals, nodePositions, onNodeMove }) {
  const svgRef = useRef(null);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [zoom, setZoom] = useState(1);
  const [draggingNodeId, setDraggingNodeId] = useState(null);
  const [isPanning, setIsPanning] = useState(false);
  const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

  useEffect(() => {
    if (!nodePositions || Object.keys(nodePositions).length === 0) return;
    const xs = Object.values(nodePositions).map(p => p.x);
    const ys = Object.values(nodePositions).map(p => p.y);
    const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
    const midY = (Math.min(...ys) + Math.max(...ys)) / 2;
    if (svgRef.current) {
      const rect = svgRef.current.getBoundingClientRect();
      setPan({ x: rect.width / 2 - midX, y: Math.max(50, rect.height / 2 - midY) });
    }
  }, [nodePositions]);

  const handlePointerDown = (e) => {
    if (e.target.tagName === 'svg' || e.target.id === 'canvas-bg') {
      setIsPanning(true);
      setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
    }
  };

  const handlePointerMove = (e) => {
    if (draggingNodeId) {
      const rect = svgRef.current.getBoundingClientRect();
      const currentX = (e.clientX - rect.left - pan.x) / zoom;
      const currentY = (e.clientY - rect.top - pan.y) / zoom;
      onNodeMove(draggingNodeId, currentX, currentY);
    } else if (isPanning) {
      setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
    }
  };

  const handlePointerUp = () => {
    setDraggingNodeId(null);
    setIsPanning(false);
  };

  if (!root || !nodePositions || Object.keys(nodePositions).length === 0) {
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1rem',color:'var(--text3)'}}>
        <div style={{fontSize:'4.5rem',opacity:.1}}>🌲</div>
        <div style={{fontWeight:600,fontSize:'1.05rem',color:'var(--text2)'}}>Canvas Empty</div>
        <div style={{fontSize:'.85rem',opacity:.75,maxWidth:260,textAlign:'center'}}>Insert node values or load an example preset.</div>
      </div>
    );
  }

  const nodes = collectNodes(root);
  const edges = collectTreeEdges(root, nodePositions);

  const getFill = (v) => {
    if (foundVals && foundVals.includes(v)) return '#10b981';
    if (v === currentVal) return '#6366f1';
    if (visitedVals && visitedVals.includes(v)) return '#1e3a5f';
    return '#1a2235';
  };
  const getStroke = (v) => {
    if (foundVals && foundVals.includes(v)) return '#34d399';
    if (v === currentVal) return '#818cf8';
    if (visitedVals && visitedVals.includes(v)) return '#2563eb';
    return '#263347';
  };

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
      <div className="canvas-toolbar">
        <button onClick={() => setZoom(z => Math.min(z + 0.15, 2))}>🔍+</button>
        <button onClick={() => setZoom(z => Math.max(z - 0.15, 0.4))}>🔍−</button>
        <button onClick={() => { setZoom(1); }}>⟲ Reset</button>
      </div>

      <svg
        ref={svgRef}
        id="canvas-bg"
        style={{width:'100%',height:'100%',display:'block'}}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
      >
        <g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
          {edges.map((e, idx) => (
            <line key={idx} x1={e.from.x} y1={e.from.y} x2={e.to.x} y2={e.to.y} stroke="#263347" strokeWidth="2.5" />
          ))}

          {nodes.map(n => {
            const p = nodePositions[n.id];
            if (!p) return null;
            const isCur = n.val === currentVal;
            const isFound = foundVals && foundVals.includes(n.val);
            return (
              <g
                key={n.id}
                transform={`translate(${p.x},${p.y})`}
                style={{cursor: draggingNodeId === n.id ? 'grabbing' : 'grab'}}
                onPointerDown={(e) => { e.stopPropagation(); setDraggingNodeId(n.id); }}
              >
                {(isCur || isFound) && (
                  <circle r="32" fill={isFound ? 'rgba(16,185,129,.2)' : 'rgba(99,102,241,.2)'} />
                )}
                <circle r="23" fill={getFill(n.val)} stroke={getStroke(n.val)} strokeWidth="2.5" />
                <text textAnchor="middle" dominantBaseline="central" fill="#f1f5f9" fontSize="13" fontWeight="700" style={{pointerEvents:'none',userSelect:'none'}}>
                  {n.val}
                </text>
              </g>
            );
          })}
        </g>
      </svg>
    </div>
  );
}

/* Main Visualizer Page */
function VisualizerPage({ serverOnline }) {
  const [root, setRoot] = useState(null);
  const [nodePositions, setNodePositions] = useState({});
  const [insertVal, setInsertVal] = useState('');
  const [deleteVal, setDeleteVal] = useState('');
  const [searchVal, setSearchVal] = useState('');
  const [steps, setSteps] = useState([]);
  const [stepIdx, setStepIdx] = useState(-1);
  const [travName, setTravName] = useState('');
  const [currentVal, setCurrentVal] = useState(null);
  const [visitedVals, setVisitedVals] = useState([]);
  const [foundVals, setFoundVals] = useState([]);
  const [toast, setToast] = useState(null);
  const showToast = (msg, type='info') => setToast({ msg, type, key: Date.now() });

  const refreshTree = (newRoot) => {
    setRoot(newRoot);
    if (!newRoot || newRoot.val === null) {
      setNodePositions({});
    } else {
      const calculated = computeTreeLayout(newRoot);
      setNodePositions(calculated);
    }
  };

  const handleNodeMove = (id, x, y) => {
    setNodePositions(prev => ({ ...prev, [id]: { x, y } }));
  };

  // Sync tree from Backend API
  const fetchTree = async () => {
    try {
      const res = await fetch('/api/tree');
      if (res.ok) {
        const data = await res.json();
        const treeObj = dictToTree(data.tree);
        refreshTree(treeObj);
        return true;
      }
    } catch(e) {}
    return false;
  };

  // Load preset via API or fallback
  const loadPreset = async (name) => {
    if (serverOnline) {
      try {
        const res = await fetch('/api/preset', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ preset: name })
        });
        if (res.ok) {
          const data = await res.json();
          refreshTree(dictToTree(data.tree));
          resetTrav();
          showToast(`Backend loaded '${name}' via C Engine!`, 'success');
          return;
        }
      } catch(e) {}
    }

    // Client-side fallback
    const presets = {
      balanced: [50, 25, 75, 12, 37, 62, 87],
      classic: [50, 30, 70, 20, 40, 60, 80],
      dense: [40, 20, 60, 10, 30, 50, 70, 5, 15, 25, 35],
      skewed: [10, 20, 30, 40, 50]
    };
    let localRoot = null;
    (presets[name] || presets.classic).forEach(v => {
      localRoot = localBstInsert(localRoot, v);
    });
    refreshTree(localRoot);
    resetTrav();
    showToast(`Loaded '${name}' example (Client mode)`, 'info');
  };

  useEffect(() => {
    loadPreset('classic');
  }, [serverOnline]);

  const doInsert = async () => {
    const v = parseInt(insertVal);
    if (isNaN(v)) { showToast('Enter an integer', 'error'); return; }

    if (serverOnline) {
      try {
        const res = await fetch('/api/insert', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ val: v })
        });
        if (res.ok) {
          const data = await res.json();
          refreshTree(dictToTree(data.tree));
          setInsertVal('');
          resetTrav();
          showToast(`C Engine inserted ${v}`, 'success');
          return;
        }
      } catch(e) {}
    }

    // Fallback
    refreshTree(localBstInsert(root, v));
    setInsertVal('');
    resetTrav();
    showToast(`Inserted ${v} (Client mode)`, 'info');
  };

  const doDelete = async () => {
    const v = parseInt(deleteVal);
    if (isNaN(v)) { showToast('Enter an integer', 'error'); return; }

    if (serverOnline) {
      try {
        const res = await fetch('/api/delete', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ val: v })
        });
        if (res.ok) {
          const data = await res.json();
          refreshTree(dictToTree(data.tree));
          setDeleteVal('');
          resetTrav();
          showToast(`C Engine deleted ${v}`, 'success');
          return;
        }
      } catch(e) {}
    }

    // Fallback
    refreshTree(localBstDelete(root, v));
    setDeleteVal('');
    resetTrav();
    showToast(`Deleted ${v} (Client mode)`, 'info');
  };

  const doSearch = async () => {
    const v = parseInt(searchVal);
    if (isNaN(v) || !root) { showToast('Enter value to search', 'error'); return; }

    if (serverOnline) {
      try {
        const res = await fetch(`/api/search?val=${v}`);
        if (res.ok) {
          const data = await res.json();
          if (data.found) {
            setFoundVals([v]);
            setVisitedVals(data.path.slice(0, -1));
            showToast(`Found ${v}! Path: ${data.path.join(' → ')}`, 'success');
          } else {
            setVisitedVals(data.path);
            setFoundVals([]);
            showToast(`${v} not found`, 'error');
          }
          return;
        }
      } catch(e) {}
    }

    // Fallback search
    const path = [];
    let cur = root;
    while (cur && cur.val !== null) {
      path.push(cur.val);
      if (v === cur.val) break;
      cur = v < cur.val ? cur.left : cur.right;
    }
    if (path.length && path[path.length - 1] === v) {
      setFoundVals([v]);
      setVisitedVals(path.slice(0, -1));
      showToast(`Found ${v}! Path: ${path.join(' → ')}`, 'success');
    } else {
      setVisitedVals(path);
      setFoundVals([]);
      showToast(`${v} not found`, 'error');
    }
  };

  const runTraversal = async (type) => {
    if (!root) { showToast('Tree is empty', 'error'); return; }

    if (serverOnline) {
      try {
        const res = await fetch(`/api/traverse?type=${type}`);
        if (res.ok) {
          const data = await res.json();
          setSteps(data.steps);
          setStepIdx(0);
          setTravName(type);
          setCurrentVal(data.steps[0]?.current ?? null);
          setVisitedVals(data.steps[0]?.visited ?? []);
          setFoundVals([]);
          showToast(`C Engine computed ${type.toUpperCase()}`, 'info');
          return;
        }
      } catch(e) {}
    }

    // Client-side fallback
    const res = [];
    if (type === 'inorder') {
      const inorder = (n) => { if (!n) return; inorder(n.left); res.push(n.val); inorder(n.right); };
      inorder(root);
    } else if (type === 'preorder') {
      const preorder = (n) => { if (!n) return; res.push(n.val); preorder(n.left); preorder(n.right); };
      preorder(root);
    } else if (type === 'postorder') {
      const postorder = (n) => { if (!n) return; postorder(n.left); postorder(n.right); res.push(n.val); };
      postorder(root);
    } else {
      const q = [root];
      while (q.length) {
        const cur = q.shift();
        res.push(cur.val);
        if (cur.left) q.push(cur.left);
        if (cur.right) q.push(cur.right);
      }
    }
    const localSteps = res.map((val, idx) => ({
      current: val,
      visited: res.slice(0, idx + 1),
      msg: `Step ${idx+1}: Visiting node ${val}`
    }));
    setSteps(localSteps);
    setStepIdx(0);
    setTravName(type);
    setCurrentVal(localSteps[0]?.current ?? null);
    setVisitedVals(localSteps[0]?.visited ?? []);
  };

  const resetTrav = () => {
    setSteps([]);
    setStepIdx(-1);
    setTravName('');
    setCurrentVal(null);
    setVisitedVals([]);
    setFoundVals([]);
  };

  const stepF = () => {
    const ni = Math.min(stepIdx + 1, steps.length - 1);
    const s = steps[ni];
    setStepIdx(ni);
    setCurrentVal(s?.current ?? null);
    setVisitedVals(s?.visited ?? []);
  };

  const stepB = () => {
    const ni = Math.max(stepIdx - 1, 0);
    const s = steps[ni];
    setStepIdx(ni);
    setCurrentVal(s?.current ?? null);
    setVisitedVals(s?.visited ?? []);
  };

  const curStep = steps[stepIdx] || null;
  const nodeCount = useMemo(() => collectNodes(root).length, [root]);

  return (
    <div className="viz-page">
      {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}

      <div className="viz-panel">
        <div className="vp-sec">
          <div className="vp-title">⚡ Preloaded Examples</div>
          <div className="vbtn-grid2">
            <button className="vbtn vbtn-ghost" onClick={() => loadPreset('classic')}>Classic BST</button>
            <button className="vbtn vbtn-ghost" onClick={() => loadPreset('balanced')}>Balanced Tree</button>
            <button className="vbtn vbtn-ghost" onClick={() => loadPreset('dense')}>Dense Tree</button>
            <button className="vbtn vbtn-ghost" onClick={() => loadPreset('skewed')}>Right Skewed</button>
          </div>
        </div>

        <div className="vp-sec">
          <div className="vp-title">🌱 Tree Operations (C-DSA)</div>
          <div className="vp-row">
            <input type="number" className="vp-inp" placeholder="Node value (e.g. 25)" value={insertVal} onChange={e => setInsertVal(e.target.value)} onKeyDown={e => e.key === 'Enter' && doInsert()}/>
            <button className="vbtn vbtn-primary" onClick={doInsert}>+ Add</button>
          </div>
          <div className="vp-row">
            <input type="number" className="vp-inp" placeholder="Delete value" value={deleteVal} onChange={e => setDeleteVal(e.target.value)} onKeyDown={e => e.key === 'Enter' && doDelete()}/>
            <button className="vbtn vbtn-red" onClick={doDelete}>Delete</button>
          </div>
          <div className="vp-row">
            <input type="number" className="vp-inp" placeholder="Search value" value={searchVal} onChange={e => setSearchVal(e.target.value)} onKeyDown={e => e.key === 'Enter' && doSearch()}/>
            <button className="vbtn vbtn-green" onClick={doSearch}>Find</button>
          </div>
        </div>

        <div className="vp-sec">
          <div className="vp-title">🔄 Traversals (C Engine)</div>
          <div className="vbtn-grid2" style={{marginBottom:'.5rem'}}>
            {['inorder','preorder','postorder','levelorder'].map(t => (
              <button key={t} className={`vbtn ${travName === t ? 'vbtn-primary' : 'vbtn-ghost'}`} onClick={() => runTraversal(t)}>
                {t === 'levelorder' ? 'Level Order' : t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            ))}
          </div>

          {steps.length > 0 && (
            <>
              <div className="step-bar">
                <button onClick={stepB} disabled={stepIdx <= 0}>◀ Prev</button>
                <span style={{fontSize:'.75rem',color:'var(--text3)',textAlign:'center',padding:'.3rem',minWidth:50}}>
                  {stepIdx + 1}/{steps.length}
                </span>
                <button onClick={stepF} disabled={stepIdx >= steps.length - 1}>Next ▶</button>
              </div>
              <div className="step-info-box">{curStep?.msg || '—'}</div>
              {curStep?.visited?.length > 0 && (
                <div className="order-wrap">
                  {curStep.visited.map((v, i) => (
                    <span key={i} className={`ord-node ${v === curStep.current ? 'cur' : 'done'}`}>{v}</span>
                  ))}
                </div>
              )}
              <button className="vbtn vbtn-ghost vbtn-full" style={{marginTop:'.6rem',fontSize:'.75rem'}} onClick={resetTrav}>
                Reset Traversal
              </button>
            </>
          )}
        </div>

        <div className="vp-sec">
          <div className="vp-title">📊 Tree Status</div>
          <div style={{display:'grid',gap:'.3rem',fontSize:'.82rem'}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <span style={{color:'var(--text3)'}}>Engine Backend:</span>
              <strong style={{color: serverOnline ? 'var(--green)' : 'var(--yellow)'}}>
                {serverOnline ? 'Python + C Engine' : 'Client Mode'}
              </strong>
            </div>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <span style={{color:'var(--text3)'}}>Total Nodes:</span>
              <strong style={{color:'var(--accent)'}}>{nodeCount}</strong>
            </div>
          </div>
        </div>
      </div>

      <div className="viz-canvas-wrap">
        <div className="canvas-hint-pill">
          🖱 Drag nodes to reposition • Drag canvas to pan
        </div>

        <TreeCanvas
          root={root}
          currentVal={currentVal}
          visitedVals={visitedVals}
          foundVals={foundVals}
          nodePositions={nodePositions}
          onNodeMove={handleNodeMove}
        />

        <div className="canvas-legend">
          <div className="leg-item"><div className="leg-dot" style={{background:'#1a2235',border:'1.5px solid #263347'}}/>Default</div>
          <div className="leg-item"><div className="leg-dot" style={{background:'#1e3a5f',border:'1.5px solid #2563eb'}}/>Visited</div>
          <div className="leg-item"><div className="leg-dot" style={{background:'#6366f1',border:'1.5px solid #818cf8'}}/>Current</div>
          <div className="leg-item"><div className="leg-dot" style={{background:'#10b981',border:'1.5px solid #34d399'}}/>Target</div>
        </div>
      </div>
    </div>
  );
}

          <div className="code-block">
            typedef struct TreeNode &#123;<br/>

            &nbsp;&nbsp;int height;<br/>
            &nbsp;&nbsp;struct TreeNode *left;<br/>
            &nbsp;&nbsp;struct TreeNode *right;<br/>
            &#125; TreeNode;

      )}

          <div className="sec-eyebrow">Personal Notebook</div>

            <span>{n.label}</span>
          </button>
        ))}
      </div>
    </>

}
