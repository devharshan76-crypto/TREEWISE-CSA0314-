<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>TreeWise – Interactive Tree Algorithm Learning Platform</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ═══════════ DESIGN TOKENS ═══════════ */
:root{
  --bg:#06080f;
  --bg2:#0d1221;
  --bg3:#111827;
  --bg4:#1a2235;
  --bg5:#232d42;
  --border:#1e2d45;
  --border2:#263347;
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --accent3:#06b6d4;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#64748b;
  --r:10px;
  --r2:16px;
  --shadow:0 8px 32px rgba(0,0,0,.6);
  --glow:0 0 24px rgba(99,102,241,.25);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit;transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit}
svg{flex-shrink:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ═══════════ NAVBAR ═══════════ */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;background:rgba(6,8,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem}
.nav-brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.15rem;cursor:pointer;letter-spacing:-.02em}
.nav-brand-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:var(--glow)}
.nav-brand-text{background:linear-gradient(90deg,#a5b4fc,#c4b5fd,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:.25rem;margin-left:1.5rem}
.nav-link{padding:.4rem .85rem;border-radius:8px;font-size:.875rem;color:var(--text2);background:transparent}
.nav-link:hover{color:var(--text);background:var(--bg4)}
.nav-link.active{color:var(--text);background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.3)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.nav-badge{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:.3rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;box-shadow:var(--glow)}

/* Mobile Bottom Navigation Bar */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(6,8,15,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);z-index:200;justify-content:space-around;align-items:center;padding:0 .5rem}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;color:var(--text3);font-size:.72rem;font-weight:600;padding:.35rem .75rem;border-radius:8px;flex:1}
.bottom-nav-item.active{color:#a5b4fc}
.bottom-nav-item svg{font-size:1.2rem}

/* ═══════════ HERO ═══════════ */
.hero{padding:7rem 1.5rem 4rem;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,.18) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 80% 50%,rgba(6,182,212,.08) 0%,transparent 60%);pointer-events:none}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;mask-image:radial-gradient(ellipse at center,black 0%,transparent 70%)}
.hero-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);border-radius:999px;padding:.35rem 1rem;font-size:.8rem;color:#a5b4fc;margin-bottom:1.5rem}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.9)}}
.hero h1{font-size:clamp(1.9rem,5.5vw,3.8rem);font-weight:900;line-height:1.15;letter-spacing:-.03em;margin-bottom:1rem}
.grad{background:linear-gradient(135deg,#a5b4fc 0%,#c4b5fd 40%,#67e8f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{max-width:560px;margin:0 auto 2rem;color:var(--text2);font-size:1.02rem;line-height:1.6}
.hero-cta{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem}
.btn-hero{padding:.7rem 1.5rem;border-radius:12px;font-weight:700;font-size:.95rem}
.btn-grad{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.btn-grad:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(99,102,241,.5)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border2)}
.btn-outline:hover{background:var(--bg4);border-color:var(--accent)}
.hero-stats{display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}
.h-stat-val{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#a5b4fc,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.h-stat-lbl{font-size:.78rem;color:var(--text3)}

/* ═══════════ SECTIONS ═══════════ */
.sec{padding:4rem 1.5rem;max-width:1200px;margin:0 auto}
.sec-eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.sec-eyebrow::before{content:'';width:18px;height:2px;background:var(--accent);border-radius:1px}
.sec-title{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin-bottom:.6rem;line-height:1.2}
.sec-sub{color:var(--text2);max-width:500px;margin-bottom:2.5rem;font-size:.95rem;line-height:1.6}
.glow-line{height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:0 1.5rem}

/* ═══════════ FEATURE CARDS ═══════════ */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.25rem}
.feat-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.feat-card:hover{border-color:rgba(99,102,241,.5);transform:translateY(-2px);box-shadow:0 10px 32px rgba(99,102,241,.15)}
.feat-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;margin-bottom:1.1rem}
.fi-indigo{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3)}
.fi-cyan{background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.25)}
.fi-green{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25)}
.fi-yellow{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25)}
.fi-pink{background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.25)}
.fi-violet{background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3)}
.feat-card h3{font-size:1.02rem;font-weight:700;margin-bottom:.4rem}
.feat-card p{font-size:.85rem;color:var(--text2);line-height:1.5}
.feat-tag{display:inline-block;margin-top:.75rem;font-size:.72rem;padding:.2rem .55rem;border-radius:4px;font-weight:600}
.tag-new{background:rgba(16,185,129,.15);color:var(--green)}
.tag-core{background:rgba(245,158,11,.12);color:var(--yellow)}

/* ═══════════ TOPIC CARDS ═══════════ */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.topic-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;transition:all .3s}
.topic-card:hover{border-color:rgba(99,102,241,.4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.12)}
.topic-header{padding:1.1rem 1.25rem .5rem;display:flex;align-items:center;gap:.7rem}
.topic-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.topic-title{font-weight:700;font-size:.95rem}
.topic-cat{font-size:.75rem;color:var(--text3);margin-top:.05rem}
.topic-body{padding:.25rem 1.25rem 1rem}
.topic-desc{font-size:.82rem;color:var(--text2);margin-bottom:.8rem;line-height:1.5}
.topic-pills{display:flex;gap:.4rem;flex-wrap:wrap}
.topic-pill{font-size:.72rem;padding:.18rem .55rem;border-radius:4px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.topic-footer{border-top:1px solid var(--border);padding:.75rem 1.25rem;display:flex;justify-content:space-between;align-items:center}
.topic-cplx{font-size:.78rem;font-family:monospace;color:var(--yellow)}

/* ═══════════ BUTTONS & INPUTS ═══════════ */
.vbtn{padding:.48rem .85rem;border-radius:8px;font-size:.82rem;font-weight:600;transition:all .2s;white-space:nowrap}
.vbtn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.vbtn-primary:hover{filter:brightness(1.1)}
.vbtn-ghost{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}
.vbtn-ghost:hover{background:var(--bg5);color:var(--text)}
.vbtn-red{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.vbtn-red:hover{background:rgba(239,68,68,.2)}
.vbtn-green{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.vbtn-green:hover{background:rgba(16,185,129,.2)}
.vbtn-full{width:100%;margin-bottom:.35rem}

/* ═══════════ VISUALIZER DASHBOARD ═══════════ */
.viz-page{display:flex;height:calc(100vh - 60px);margin-top:60px;overflow:hidden;position:relative}
.viz-panel{width:320px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.viz-canvas-wrap{flex:1;position:relative;background:var(--bg);overflow:hidden;cursor:grab}
.viz-canvas-wrap:active{cursor:grabbing}

.vp-sec{border-bottom:1px solid var(--border);padding:.9rem 1rem}
.vp-title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:.65rem;display:flex;align-items:center;gap:.4rem}
.vp-inp{flex:1;padding:.48rem .75rem;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:.85rem;width:100%}
.vp-inp:focus{outline:none;border-color:var(--accent)}
.vp-row{display:flex;gap:.4rem;margin-bottom:.4rem}
.vbtn-grid2{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.vbtn-grid3{display:grid;grid-template-columns:repeat(3, 1fr);gap:.35rem}

.step-bar{display:flex;gap:.35rem;align-items:center}
.step-bar button{flex:1;padding:.45rem;background:var(--bg4);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:.8rem;font-weight:600}
.step-bar button:hover:not(:disabled){background:var(--bg5);color:var(--text)}
.step-bar button:disabled{opacity:.35;cursor:not-allowed}
.step-info-box{background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:.6rem .8rem;font-size:.82rem;color:var(--text2);margin-top:.45rem;min-height:46px;line-height:1.45}
.step-info-box strong{color:var(--text)}

.order-wrap{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.ord-node{background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:.15rem .5rem;font-size:.78rem;transition:all .3s}
.ord-node.cur{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 8px rgba(99,102,241,.5)}
.ord-node.done{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.35);color:#a5b4fc}

/* Canvas Floating Overlays */
.canvas-hint-pill{position:absolute;top:.75rem;left:50%;transform:translateX(-50%);background:rgba(13,18,33,.88);border:1px solid rgba(99,102,241,.35);border-radius:999px;padding:.32rem .9rem;font-size:.78rem;color:#a5b4fc;backdrop-filter:blur(10px);white-space:nowrap;pointer-events:none;z-index:10}
.canvas-toolbar{position:absolute;top:.75rem;right:.75rem;display:flex;gap:.35rem;z-index:10}
.canvas-toolbar button{background:rgba(13,18,33,.88);border:1px solid var(--border2);color:var(--text2);padding:.4rem .65rem;border-radius:8px;font-size:.8rem;backdrop-filter:blur(8px)}
.canvas-toolbar button:hover{background:var(--bg4);color:var(--text)}
.canvas-legend{position:absolute;bottom:.75rem;left:.75rem;background:rgba(13,18,33,.88);backdrop-filter:blur(8px);border:1px solid var(--border2);border-radius:var(--r);padding:.5rem .85rem;font-size:.75rem;display:flex;gap:.8rem;flex-wrap:wrap;z-index:10;pointer-events:none}
.leg-item{display:flex;align-items:center;gap:.3rem;color:var(--text2)}
.leg-dot{width:9px;height:9px;border-radius:50%}

/* Mobile visualizer drawer trigger */
.mobile-drawer-btn{display:none;position:absolute;bottom:1.25rem;right:1.25rem;z-index:20;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:.65rem 1.1rem;border-radius:999px;font-weight:700;font-size:.85rem;box-shadow:0 6px 20px rgba(99,102,241,.5)}

/* ═══════════ LEARN PAGE ═══════════ */
.learn-layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px);margin-top:60px}
.learn-nav{background:var(--bg2);border-right:1px solid var(--border);padding:1.25rem 1rem;overflow-y:auto}
.learn-group{margin-bottom:1.4rem}
.learn-group-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);font-weight:700;padding:.25rem .5rem;margin-bottom:.35rem}
.learn-item{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;padding:.48rem .7rem;border-radius:8px;font-size:.85rem;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .2s}
.learn-item:hover{background:var(--bg4);color:var(--text)}
.learn-item.active{background:rgba(99,102,241,.18);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)}
.learn-item-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0}
.learn-item.active .learn-item-dot{background:var(--accent)}
.learn-content{padding:2.5rem 2rem;overflow-y:auto;max-width:840px}
.learn-article h1{font-size:1.85rem;font-weight:800;margin-bottom:.4rem;line-height:1.2}
.learn-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .75rem;border-radius:999px;font-size:.75rem;font-weight:600;margin-bottom:1.4rem;border:1px solid}
.lb-core{background:rgba(99,102,241,.12);color:#a5b4fc;border-color:rgba(99,102,241,.25)}
.lb-traversal{background:rgba(6,182,212,.12);color:var(--accent3);border-color:rgba(6,182,212,.2)}
.lb-balanced{background:rgba(16,185,129,.12);color:var(--green);border-color:rgba(16,185,129,.2)}
.lb-advanced{background:rgba(139,92,246,.12);color:#c4b5fd;border-color:rgba(139,92,246,.2)}
.learn-article p{color:var(--text2);margin-bottom:1.2rem;line-height:1.7;font-size:.95rem}
.learn-article h2{font-size:1.25rem;font-weight:700;margin:1.8rem 0 .65rem}
.learn-article ul{padding-left:1.4rem;color:var(--text2);font-size:.92rem;line-height:1.7;margin-bottom:1.2rem}
.code-block{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:1.1rem 1.4rem;font-family:'Cascadia Code','Fira Code',monospace;font-size:.82rem;color:#a5b4fc;overflow-x:auto;margin:.8rem 0 1.4rem;line-height:1.6}
.kw{color:#c4b5fd}.fn{color:var(--accent3)}.cm{color:var(--text3)}
.cplx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.65rem;margin:1rem 0}
.cplx-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.cplx-label{font-size:.72rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2rem}
.cplx-val{font-size:1.2rem;font-weight:800;font-family:monospace}
.cplx-val.good{color:var(--green)}.cplx-val.ok{color:var(--yellow)}.cplx-val.bad{color:var(--red)}
.algo-steps{display:flex;flex-direction:column;gap:.5rem;margin:.8rem 0 1.2rem}
.algo-step{display:flex;gap:.8rem;align-items:flex-start;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem}
.algo-step-num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;color:#fff}
.algo-step-text{font-size:.85rem;color:var(--text2);line-height:1.45;padding-top:.15rem}
.algo-step-text strong{color:var(--text)}
.trav-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:.8rem 0 1.4rem}
.trav-table th{text-align:left;padding:.55rem .75rem;background:var(--bg4);color:var(--text2);font-weight:600;font-size:.75rem;text-transform:uppercase}
.trav-table td{padding:.55rem .75rem;border-bottom:1px solid var(--border)}
.trav-table tr:last-child td{border-bottom:none}
.trav-table td:last-child{font-family:monospace;color:var(--accent3)}

/* ═══════════ NOTES ═══════════ */
.notes-page{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px);margin-top:60px}
.notes-side{background:var(--bg2);border-right:1px solid var(--border);padding:1.1rem;overflow-y:auto}
.notes-side-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.notes-side-hdr h3{font-size:.88rem;font-weight:700}
.note-list-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:.75rem .9rem;cursor:pointer;margin-bottom:.45rem;transition:all .2s}
.note-list-item:hover{border-color:rgba(99,102,241,.4)}
.note-list-item.active{border-color:var(--accent);background:rgba(99,102,241,.06)}
.note-list-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-list-meta{font-size:.72rem;color:var(--text3);margin-top:.15rem}
.notes-editor-wrap{display:flex;flex-direction:column}
.notes-top{padding:.9rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.65rem;background:var(--bg2)}
.note-title-inp{flex:1;background:transparent;border:none;color:var(--text);font-size:1.05rem;font-weight:700;padding:0}
.note-title-inp:focus{outline:none}
.note-title-inp::placeholder{color:var(--text3)}
.notes-toolbar-row{padding:.5rem 1.25rem;border-bottom:1px solid var(--border);display:flex;gap:.35rem;flex-wrap:wrap;background:var(--bg3)}
.notes-toolbar-row button{padding:.28rem .55rem;background:var(--bg4);border:1px solid var(--border2);color:var(--text2);border-radius:6px;font-size:.75rem}
.notes-toolbar-row button:hover{background:var(--bg5);color:var(--text)}
.notes-textarea{flex:1;background:transparent;border:none;color:var(--text);padding:1.25rem;font-size:.92rem;line-height:1.7;resize:none;min-height:400px}
.notes-textarea:focus{outline:none}
.notes-footer-row{padding:.6rem 1.25rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text3);background:var(--bg2)}

/* ═══════════ TOAST ═══════════ */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:.75rem 1.15rem;font-size:.85rem;z-index:9999;box-shadow:var(--shadow);display:flex;align-items:center;gap:.55rem;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.info{border-color:var(--accent);color:#a5b4fc}

/* ═══════════ RESPONSIVE BREAKPOINTS (Mobile & Tablets) ═══════════ */

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ═══════════ PRELOADED BST EXAMPLES ═══════════ */
const TREE_PRESETS = {
  balanced: {
    name: 'Balanced Tree',
    desc: 'Balanced 7-node BST',
    values: [50, 25, 75, 12, 37, 62, 87]
  },
  classic: {
    name: 'Classic BST',
    desc: 'Standard textbook tree',
    values: [50, 30, 70, 20, 40, 60, 80]
  },
  fibonacci: {
    name: 'Dense Tree',
    desc: 'Multi-level search tree',
    values: [40, 20, 60, 10, 30, 50, 70, 5, 15, 25, 35]
  },
  skewed: {
    name: 'Right Skewed',
    desc: 'Worst-case degenerate tree',
    values: [10, 20, 30, 40, 50]
  }
};

/* ═══════════ BST DATA STRUCTURE & HELPERS ═══════════ */
class BSTNode {
  constructor(v) {
    this.val = v;
    this.left = null;
    this.right = null;
    this.id = Math.random().toString(36).slice(2);
  }
}

function bstInsert(root, v) {
  if (!root) return new BSTNode(v);
  if (v < root.val) root.left = bstInsert(root.left, v);
  else if (v > root.val) root.right = bstInsert(root.right, v);
  return root;
}

function bstDelete(root, v) {
  if (!root) return null;
  if (v < root.val) { root.left = bstDelete(root.left, v); return root; }
  if (v > root.val) { root.right = bstDelete(root.right, v); return root; }
  if (!root.left) return root.right;
  if (!root.right) return root.left;
  let s = root.right;
  while (s.left) s = s.left;
  root.val = s.val;
  root.right = bstDelete(root.right, s.val);
  return root;
}

function cloneTree(n) {
  if (!n) return null;
  const c = new BSTNode(n.val);
  c.id = n.id;
  c.left = cloneTree(n.left);
  c.right = cloneTree(n.right);
  return c;
}

function collectNodes(n, a=[]) {
  if (!n) return a;
  a.push(n);
  collectNodes(n.left, a);
  collectNodes(n.right, a);
  return a;
}

/* Compute hierarchy layout coordinates */
function computeTreeLayout(root) {
  const pos = {};
  const H = 64, V = 82;
  function getWidth(n) {
    if (!n) return 0;
    return Math.max(1, getWidth(n.left) + getWidth(n.right));
  }
  function assignPos(n, depth, left, right) {
    if (!n) return;
    const mid = (left + right) / 2;
    pos[n.id] = { x: mid, y: depth * V + 60 };
    assignPos(n.left, depth + 1, left, mid);
    assignPos(n.right, depth + 1, mid, right);
  }
  const totalW = Math.max(getWidth(root), 1);
  assignPos(root, 0, 0, totalW * H);
  return pos;
}

function collectTreeEdges(node, pos, edges=[]) {
  if (!node) return edges;
  if (node.left && pos[node.left.id]) {
    edges.push({ from: pos[node.id], to: pos[node.left.id], fromId: node.id, toId: node.left.id });
    collectTreeEdges(node.left, pos, edges);
  }
  if (node.right && pos[node.right.id]) {
    edges.push({ from: pos[node.id], to: pos[node.right.id], fromId: node.id, toId: node.right.id });
    collectTreeEdges(node.right, pos, edges);
  }
  return edges;
}

/* ═══════════ TRAVERSALS ═══════════ */
function inorderSteps(root) {
  const steps = [], visited = [];
  steps.push({ visited: [], current: null, msg: 'Start Inorder: Left → Root → Right' });
  const run = (node) => {
    if (!node) return;
    run(node.left);
    visited.push(node.val);
    steps.push({ visited: [...visited], current: node.val, msg: `Visiting node ${node.val}` });
    run(node.right);
  };
  run(root);
  steps.push({ visited: [...visited], current: null, msg: 'Inorder complete! Result is sorted ✓' });
  return steps;
}

function preorderSteps(root) {
  const steps = [], visited = [];
  steps.push({ visited: [], current: null, msg: 'Start Preorder: Root → Left → Right' });
  const run = (node) => {
    if (!node) return;
    visited.push(node.val);
    steps.push({ visited: [...visited], current: node.val, msg: `Visiting root node ${node.val}` });
    run(node.left);
    run(node.right);
  };
  run(root);
  steps.push({ visited: [...visited], current: null, msg: 'Preorder complete!' });
  return steps;
}

function postorderSteps(root) {
  const steps = [], visited = [];
  steps.push({ visited: [], current: null, msg: 'Start Postorder: Left → Right → Root' });
  const run = (node) => {
    if (!node) return;
    run(node.left);
    run(node.right);
    visited.push(node.val);
    steps.push({ visited: [...visited], current: node.val, msg: `Visiting node ${node.val} (after subtrees)` });
  };
  run(root);
  steps.push({ visited: [...visited], current: null, msg: 'Postorder complete!' });
  return steps;
}

function levelorderSteps(root) {
  const steps = [], visited = [];
  if (!root) return steps;
  steps.push({ visited: [], current: null, queue: [root.val], msg: 'Enqueue root node to start Level Order (BFS)' });
  const q = [root];
  while (q.length) {
    const node = q.shift();
    visited.push(node.val);
    if (node.left) q.push(node.left);
    if (node.right) q.push(node.right);
    steps.push({ visited: [...visited], current: node.val, queue: q.map(n => n.val), msg: `Visiting level node ${node.val}` });
  }
  steps.push({ visited: [...visited], current: null, queue: [], msg: 'Level order traversal complete!' });
  return steps;
}

/* ═══════════ TOAST COMPONENT ═══════════ */
function Toast({ msg, type, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2600); return () => clearTimeout(t); }, []);
  const ic = { success: '✓', error: '✕', info: 'ℹ' };
  return <div className={`toast ${type}`}><span>{ic[type] || '•'}</span>{msg}</div>;
}

/* ═══════════ INTERACTIVE SVG CANVAS (Drag, Pan, Zoom) ═══════════ */
function InteractiveTreeSVG({ root, currentVal, visitedVals, foundVals, nodePositions, onNodeMove }) {
  const svgRef = useRef(null);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const [zoom, setZoom] = useState(1);
  const [draggingNodeId, setDraggingNodeId] = useState(null);
  const [isPanning, setIsPanning] = useState(false);
  const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

  // Center tree whenever layout recalculates
  useEffect(() => {
    if (!nodePositions || Object.keys(nodePositions).length === 0) return;
    const xs = Object.values(nodePositions).map(p => p.x);
    const ys = Object.values(nodePositions).map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const midX = (minX + maxX) / 2;
    const midY = (minY + maxY) / 2;
    
    if (svgRef.current) {
      const rect = svgRef.current.getBoundingClientRect();
      setPan({ x: rect.width / 2 - midX, y: Math.max(50, rect.height / 2 - midY) });
      // auto fit zoom for small screens
      if (rect.width < 500 && (maxX - minX) > 300) {
        setZoom(0.85);
      } else {
        setZoom(1);
      }
    }
  }, [nodePositions]);

  // Pointer & Touch handlers
  const handlePointerDown = (e) => {
    // If clicking directly on SVG canvas (not a node), start canvas panning
    if (e.target.tagName === 'svg' || e.target.id === 'canvas-bg') {
      setIsPanning(true);
      setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
    }
  };

  const handlePointerMove = (e) => {
    if (draggingNodeId) {
      const rect = svgRef.current.getBoundingClientRect();
      const currentX = (e.clientX - rect.left - pan.x) / zoom;
      const currentY = (e.clientY - rect.top - pan.y) / zoom;
      onNodeMove(draggingNodeId, currentX, currentY);
    } else if (isPanning) {
      setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
    }
  };

  const handlePointerUp = () => {
    setDraggingNodeId(null);
    setIsPanning(false);
  };

  const handleNodePointerDown = (id, e) => {
    e.stopPropagation();
    setDraggingNodeId(id);
  };

  const resetView = () => {
    if (!nodePositions || Object.keys(nodePositions).length === 0) return;
    const xs = Object.values(nodePositions).map(p => p.x);
    const ys = Object.values(nodePositions).map(p => p.y);
    const midX = (Math.min(...xs) + Math.max(...xs)) / 2;
    const midY = (Math.min(...ys) + Math.max(...ys)) / 2;
    const rect = svgRef.current?.getBoundingClientRect();
    if (rect) {
      setPan({ x: rect.width / 2 - midX, y: 70 });
      setZoom(1);
    }
  };

  if (!root || !nodePositions || Object.keys(nodePositions).length === 0) {
    return (
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'1rem',color:'var(--text3)'}}>
        <div style={{fontSize:'4.5rem',opacity:.1}}>🌲</div>
        <div style={{fontWeight:600,fontSize:'1.05rem',color:'var(--text2)'}}>Canvas is Empty</div>
        <div style={{fontSize:'.85rem',opacity:.75,maxWidth:260,textAlign:'center'}}>Choose a preloaded example or insert node values to create a tree.</div>
      </div>
    );
  }

  const nodes = collectNodes(root);
  const edges = collectTreeEdges(root, nodePositions);

  const getFill = (v) => {
    if (foundVals && foundVals.includes(v)) return '#10b981';
    if (v === currentVal) return '#6366f1';
    if (visitedVals && visitedVals.includes(v)) return '#1e3a5f';
    return '#1a2235';
  };
  const getStroke = (v) => {
    if (foundVals && foundVals.includes(v)) return '#34d399';
    if (v === currentVal) return '#818cf8';
    if (visitedVals && visitedVals.includes(v)) return '#2563eb';
    return '#263347';
  };

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
      {/* Zoom / Reset Toolbar */}
      <div className="canvas-toolbar">
        <button onClick={() => setZoom(z => Math.min(z + 0.15, 2))} title="Zoom In">🔍+</button>
        <button onClick={() => setZoom(z => Math.max(z - 0.15, 0.4))} title="Zoom Out">🔍−</button>
        <button onClick={resetView} title="Reset Canvas View">⟲ Center</button>
      </div>

      <svg
        ref={svgRef}
        id="canvas-bg"
        style={{width:'100%',height:'100%',display:'block'}}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={handlePointerUp}
      >
        <defs>
          <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>

        <g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
          {/* Edges */}
          {edges.map((e, idx) => (
            <line
              key={idx}
              x1={e.from.x}
              y1={e.from.y}
              x2={e.to.x}
              y2={e.to.y}
              stroke="#263347"
              strokeWidth="2.5"
            />
          ))}

          {/* Interactive Draggable Nodes */}
          {nodes.map(n => {
            const p = nodePositions[n.id];
            if (!p) return null;
            const isCur = n.val === currentVal;
            const isFound = foundVals && foundVals.includes(n.val);
            return (
              <g
                key={n.id}
                transform={`translate(${p.x},${p.y})`}
                style={{cursor: draggingNodeId === n.id ? 'grabbing' : 'grab'}}
                onPointerDown={(e) => handleNodePointerDown(n.id, e)}
              >
                {(isCur || isFound) && (
                  <circle r="32" fill={isFound ? 'rgba(16,185,129,.2)' : 'rgba(99,102,241,.2)'} filter="url(#glow)"/>
                )}
                <circle
                  r="23"
                  fill={getFill(n.val)}
                  stroke={getStroke(n.val)}
                  strokeWidth="2.5"
                />
                <text
                  textAnchor="middle"
                  dominantBaseline="central"
                  fill="#f1f5f9"
                  fontSize="13"
                  fontWeight="700"
                  style={{pointerEvents:'none',userSelect:'none'}}
                >
                  {n.val}
                </text>
              </g>
            );
          })}
        </g>
      </svg>
    </div>
  );
}

/* ═══════════ VISUALIZER PAGE ═══════════ */
function VisualizerPage() {
  const [root, setRoot] = useState(null);
  const [nodePositions, setNodePositions] = useState({});
  const [insertVal, setInsertVal] = useState('');
  const [deleteVal, setDeleteVal] = useState('');
  const [searchVal, setSearchVal] = useState('');
  const [steps, setSteps] = useState([]);
  const [stepIdx, setStepIdx] = useState(-1);
  const [travName, setTravName] = useState('');
  const [currentVal, setCurrentVal] = useState(null);
  const [visitedVals, setVisitedVals] = useState([]);
  const [foundVals, setFoundVals] = useState([]);
  const [toast, setToast] = useState(null);
  const showToast = (msg, type='info') => setToast({ msg, type, key: Date.now() });

  // Update layout positions when root structure changes
  const refreshLayout = (newRoot) => {
    setRoot(newRoot);
    if (!newRoot) {
      setNodePositions({});
    } else {
      const calculated = computeTreeLayout(newRoot);
      setNodePositions(calculated);
    }
  };

  // Allow cursor drag alterations
  const handleNodeMove = (id, x, y) => {
    setNodePositions(prev => ({
      ...prev,
      [id]: { x, y }
    }));
  };

  // Preloaded Example Loader
  const loadPreset = (key) => {
    const preset = TREE_PRESETS[key];
    if (!preset) return;
    let newRoot = null;
    preset.values.forEach(v => {
      newRoot = bstInsert(newRoot, v);
    });
    refreshLayout(newRoot);
    resetTrav();
    showToast(`Loaded "${preset.name}" example!`, 'success');
  };

  // Load default preset on initial mount
  useEffect(() => {
    loadPreset('classic');
  }, []);

  const doInsert = () => {
    const v = parseInt(insertVal);
    if (isNaN(v)) { showToast('Please enter an integer value', 'error'); return; }
    const updated = bstInsert(cloneTree(root), v);
    refreshLayout(updated);
    setInsertVal('');
    resetTrav();
    showToast(`Inserted ${v} into tree`, 'success');
  };

  const doDelete = () => {
    const v = parseInt(deleteVal);
    if (isNaN(v)) { showToast('Please enter an integer value', 'error'); return; }
    const updated = bstDelete(cloneTree(root), v);
    refreshLayout(updated);
    setDeleteVal('');
    resetTrav();
    showToast(`Deleted ${v} from tree`, 'success');
  };

  const doSearch = () => {
    const v = parseInt(searchVal);
    if (isNaN(v) || !root) { showToast('Enter a value to search', 'error'); return; }
    const path = [];
    let cur = root;
    while (cur) {
      path.push(cur.val);
      if (v === cur.val) break;
      cur = v < cur.val ? cur.left : cur.right;
    }
    if (path[path.length - 1] === v) {
      setFoundVals([v]);
      setVisitedVals(path.slice(0, -1));
      showToast(`Found ${v}! Search path: ${path.join(' → ')}`, 'success');
    } else {
      setVisitedVals(path);
      setFoundVals([]);
      showToast(`${v} was not found in the BST`, 'error');
    }
  };

  const doClear = () => {
    refreshLayout(null);
    resetTrav();
    showToast('Tree cleared', 'info');
  };

  const resetTrav = () => {
    setSteps([]);
    setStepIdx(-1);
    setTravName('');
    setCurrentVal(null);
    setVisitedVals([]);
    setFoundVals([]);
  };

  const runTraversal = (type) => {
    if (!root) { showToast('Construct a tree first', 'error'); return; }
    const fns = { inorder: inorderSteps, preorder: preorderSteps, postorder: postorderSteps, levelorder: levelorderSteps };
    const s = fns[type](root);
    setSteps(s);
    setStepIdx(0);
    setTravName(type);
    setCurrentVal(s[0]?.current ?? null);
    setVisitedVals([]);
    setFoundVals([]);
    showToast(`Started ${type.toUpperCase()} traversal`, 'info');
  };

  const stepF = () => {
    const ni = Math.min(stepIdx + 1, steps.length - 1);
    const s = steps[ni];
    setStepIdx(ni);
    setCurrentVal(s?.current ?? null);
    setVisitedVals(s?.visited ?? []);
  };

  const stepB = () => {
    const ni = Math.max(stepIdx - 1, 0);
    const s = steps[ni];
    setStepIdx(ni);
    setCurrentVal(s?.current ?? null);
    setVisitedVals(s?.visited ?? []);
  };

  const curStep = steps[stepIdx] || null;
  const nodeCount = useMemo(() => collectNodes(root).length, [root]);

  return (
    <div className="viz-page">
      {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}

      {/* Control Sidebar Dashboard */}
      <div className="viz-panel">
        {/* Preloaded Examples Section */}
        <div className="vp-sec">
          <div className="vp-title">⚡ Preloaded Examples</div>
          <div className="vbtn-grid2">
            {Object.keys(TREE_PRESETS).map(key => (
              <button
                key={key}
                className="vbtn vbtn-ghost"
                style={{padding:'.4rem .5rem',fontSize:'.78rem'}}
                onClick={() => loadPreset(key)}
              >
                {TREE_PRESETS[key].name}
              </button>
            ))}
          </div>
        </div>

        {/* Node Insert & Delete */}
        <div className="vp-sec">
          <div className="vp-title">🌱 Modify Tree</div>
          <div className="vp-row">
            <input
              type="number"
              className="vp-inp"
              placeholder="Node val (e.g. 25)"
              value={insertVal}
              onChange={e => setInsertVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && doInsert()}
            />
            <button className="vbtn vbtn-primary" onClick={doInsert}>+ Add</button>
          </div>
          <div className="vp-row">
            <input
              type="number"
              className="vp-inp"
              placeholder="Delete value"
              value={deleteVal}
              onChange={e => setDeleteVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && doDelete()}
            />
            <button className="vbtn vbtn-red" onClick={doDelete}>Delete</button>
          </div>
          <div className="vp-row">
            <input
              type="number"
              className="vp-inp"
              placeholder="Search value"
              value={searchVal}
              onChange={e => setSearchVal(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && doSearch()}
            />
            <button className="vbtn vbtn-green" onClick={doSearch}>Find</button>
          </div>
          <button className="vbtn vbtn-ghost vbtn-full" style={{marginTop:'.35rem',fontSize:'.78rem',color:'var(--red)'}} onClick={doClear}>
            🗑 Clear Entire Tree
          </button>
        </div>

        {/* Traversals */}
        <div className="vp-sec">
          <div className="vp-title">🔄 Traversal Algorithms</div>
          <div className="vbtn-grid2" style={{marginBottom:'.5rem'}}>
            {['inorder','preorder','postorder','levelorder'].map(t => (
              <button
                key={t}
                className={`vbtn ${travName === t ? 'vbtn-primary' : 'vbtn-ghost'}`}
                style={{padding:'.42rem .3rem',textAlign:'center',fontSize:'.78rem'}}
                onClick={() => runTraversal(t)}
              >
                {t === 'levelorder' ? 'Level Order' : t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            ))}
          </div>

          {steps.length > 0 && (
            <>
              <div className="step-bar">
                <button onClick={stepB} disabled={stepIdx <= 0}>◀ Prev</button>
                <span style={{fontSize:'.75rem',color:'var(--text3)',textAlign:'center',padding:'.3rem',minWidth:50}}>
                  {stepIdx + 1}/{steps.length}
                </span>
                <button onClick={stepF} disabled={stepIdx >= steps.length - 1}>Next ▶</button>
              </div>
              <div className="step-info-box">{curStep?.msg || '—'}</div>
              {curStep?.visited?.length > 0 && (
                <>
                  <div style={{fontSize:'.72rem',color:'var(--text3)',margin:'.5rem 0 .3rem',textTransform:'uppercase',letterSpacing:'.06em'}}>
                    Visited Sequence:
                  </div>
                  <div className="order-wrap">
                    {curStep.visited.map((v, i) => (
                      <span key={i} className={`ord-node ${v === curStep.current ? 'cur' : 'done'}`}>{v}</span>
                    ))}
                  </div>
                </>
              )}
              {curStep?.queue !== undefined && (
                <>
                  <div style={{fontSize:'.72rem',color:'var(--text3)',margin:'.5rem 0 .3rem',textTransform:'uppercase',letterSpacing:'.06em'}}>
                    BFS Queue:
                  </div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:'.3rem'}}>
                    {curStep.queue.map((v, i) => (
                      <span key={i} style={{background:'rgba(6,182,212,.15)',border:'1px solid rgba(6,182,212,.3)',color:'var(--accent3)',borderRadius:4,padding:'.15rem .45rem',fontSize:'.78rem'}}>
                        {v}
                      </span>
                    ))}
                  </div>
                </>
              )}
              <button className="vbtn vbtn-ghost vbtn-full" style={{marginTop:'.6rem',padding:'.35rem',fontSize:'.75rem'}} onClick={resetTrav}>
                Reset Traversal
              </button>
            </>
          )}
        </div>

        {/* Tree State Stats */}
        <div className="vp-sec">

/* ═══════════ NOTES PAGE ═══════════ */
const INITIAL_NOTES = [
  {
    id: '1',
    title: 'BST Concepts & Summary',
    date: 'Nov 2026',
    content: `Binary Search Tree (BST) Notes\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n1. Inorder Traversal yields nodes in strictly sorted order.\n2. Average lookup and insertion complexity: O(log n).\n3. Deletion cases:\n   - Leaf node: direct remove\n   - Single child: link child to grandparent\n   - Two children: swap with inorder successor`
  },
  {
    id: '2',
    title: 'Traversal Order Mnemonics',
    date: 'Nov 2026',
    content: `Traversal Quick Reference\n━━━━━━━━━━━━━━━━━━━━━━━━━\n• Preorder: Root FIRST (Root, Left, Right)\n• Inorder: Root in the MIDDLE (Left, Root, Right)\n• Postorder: Root LAST (Left, Right, Root)\n• Level Order: Uses Queue (FIFO)`
  }
];

function NotesPage() {
  const [notes, setNotes] = useState(INITIAL_NOTES);
  const [activeId, setActiveId] = useState('1');
  const [title, setTitle] = useState(INITIAL_NOTES[0].title);
  const [content, setContent] = useState(INITIAL_NOTES[0].content);
  const [toast, setToast] = useState(null);
  const showToast = (msg, type='info') => setToast({ msg, type, key: Date.now() });

  const activeNote = notes.find(n => n.id === activeId) || notes[0];

  const select = (n) => {
    setActiveId(n.id);
    setTitle(n.title);
    setContent(n.content);
  };

  const save = () => {
    setNotes(ns => ns.map(n => n.id === activeId ? { ...n, title, content, date: 'Just now' } : n));
    showToast('Note saved successfully!', 'success');
  };

  const add = () => {
    const id = Date.now().toString();
    const n = { id, title: 'New Note', content: '', date: 'Just now' };
    setNotes(ns => [n, ...ns]);
    select(n);
    showToast('New note created', 'info');
  };

  const del = () => {
    if (notes.length <= 1) { showToast('Cannot delete the last note', 'error'); return; }
    const r = notes.filter(n => n.id !== activeId);
    setNotes(r);
    select(r[0]);
    showToast('Note deleted', 'success');
  };

  const insertSnippet = (txt) => {
    setContent(c => c + '\n' + txt);
  };

  return (
    <div className="notes-page">
      {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onDone={() => setToast(null)} />}
      <div className="notes-side">
        <div className="notes-side-hdr">
          <h3>My Notes</h3>
          <button className="vbtn vbtn-primary" style={{padding:'.3rem .65rem',fontSize:'.75rem'}} onClick={add}>+ New</button>
        </div>
        {notes.map(n => (
          <div key={n.id} className={`note-list-item ${n.id === activeId ? 'active' : ''}`} onClick={() => select(n)}>
            <div className="note-list-title">{n.title || 'Untitled'}</div>
            <div className="note-list-meta">{n.date}</div>
          </div>
        ))}
      </div>
      <div className="notes-editor-wrap">
        <div className="notes-top">
          <input className="note-title-inp" value={title} onChange={e => setTitle(e.target.value)} placeholder="Note title..."/>
          <button className="vbtn vbtn-primary" onClick={save}>Save</button>
          <button className="vbtn vbtn-red" onClick={del}>Delete</button>
        </div>
        <div className="notes-toolbar-row">
          <span style={{fontSize:'.75rem',color:'var(--text3)',alignSelf:'center'}}>Insert:</span>
          <button onClick={() => insertSnippet('BST Rule: Left < Root < Right')}>BST Rule</button>
          <button onClick={() => insertSnippet('Inorder: Left -> Root -> Right (Sorted)')}>Inorder Snippet</button>
          <button onClick={() => insertSnippet('AVL Balance Factor = h(left) - h(right) in {-1, 0, 1}')}>AVL Formula</button>
        </div>
        <textarea
          className="notes-textarea"
          value={content}
          onChange={e => setContent(e.target.value)}
          placeholder="Write your study notes and observation here..."
        />
        <div className="notes-footer-row">
          <span>{content.length} characters</span>
          <span>Study Notes for TreeWise</span>
        </div>
      </div>
    </div>
  );
}
